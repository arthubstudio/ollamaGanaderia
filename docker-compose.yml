services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ganaderia_db
    restart: always
    environment:
      POSTGRES_USER: ganaderia
      POSTGRES_PASSWORD: ganaderia123
      POSTGRES_DB: ganaderia_ai
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/seeds.sql:/docker-entrypoint-initdb.d/001-seeds.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ganaderia -d ganaderia_ai"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  ollama:
    image: ollama/ollama:latest
    container_name: ollamaganaderia
    restart: always
    ports:
      - "127.0.0.1:11435:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  reranker:
    profiles: ["reranker"]
    build:
      context: ./services/reranker
    container_name: ganaderia_reranker
    restart: unless-stopped
    environment:
      RERANKER_MODEL: ${RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}
      RERANKER_MAX_DOCUMENTS: 50
    ports:
      - "127.0.0.1:8010:8010"
    volumes:
      - reranker_cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

volumes:
  postgres_data:
  ollama_data:
  reranker_cache:
